[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "prefix-cache-audit"
version = "0.1.0"
description = "Finds exactly which prompt segment breaks prefix-cache reuse in an agent's request traces, attributes the lost cache tokens to the responsible segment class, and prices the recovery from canonical ordering."
requires-python = ">=3.10"
license = {text = "MIT"}

[project.optional-dependencies]
dashboard = ["streamlit>=1.30"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
